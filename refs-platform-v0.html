<meta charset="utf-8">
<title>Библиотека референсов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root{
    --bg:#eceeec; --surface:#f8f8f6; --sunken:#e2e5e2; --ink:#16181a; --mut:#666c70; --line:#d3d7d4;
    --accent:#1f4fe0; --accent-ink:#ffffff; --ok:#16181a; --no:#b3261e; --no-bg:#f9e6e4; --q:#7a6a2f;
    --hatch-a:#d9dcd9; --hatch-b:#e6e8e6;
    --sans:'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif; --mono:'JetBrains Mono', ui-monospace, monospace;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111314; --surface:#1a1d1f; --sunken:#22262a; --ink:#e9ebea; --mut:#8c9297; --line:#2c3134;
      --accent:#7b96ff; --accent-ink:#0d1020; --ok:#e9ebea; --no:#ff8f86; --no-bg:#3a1f1d; --q:#d8c56b;
      --hatch-a:#23272a; --hatch-b:#1d2124;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111314; --surface:#1a1d1f; --sunken:#22262a; --ink:#e9ebea; --mut:#8c9297; --line:#2c3134;
    --accent:#7b96ff; --accent-ink:#0d1020; --ok:#e9ebea; --no:#ff8f86; --no-bg:#3a1f1d; --q:#d8c56b;
    --hatch-a:#23272a; --hatch-b:#1d2124;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg); color:var(--ink); font:14px/1.5 var(--sans); min-height:100vh}
  button,input,select,textarea{font:inherit; color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .mono{font-family:var(--mono); font-size:12px}
  .mut{color:var(--mut)}

  .top{display:flex; align-items:center; gap:18px; padding:14px 28px; border-bottom:1px solid var(--line); background:var(--surface); position:sticky; top:0; z-index:5; flex-wrap:wrap}
  .brand{font-weight:700; font-size:16px; letter-spacing:-.01em; margin-right:6px}
  .tabs{display:flex; gap:2px}
  .tab{border:0; background:none; padding:7px 12px; border-radius:8px; color:var(--mut); font-weight:500}
  .tab[aria-selected="true"]{background:var(--sunken); color:var(--ink)}
  .search{flex:1 1 220px; max-width:420px; margin-left:auto; padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg)}
  .btn{border:1px solid var(--line); background:var(--surface); padding:8px 14px; border-radius:8px; font-weight:500}
  .btn:hover{border-color:var(--mut)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn.danger{color:var(--no); border-color:var(--no)}
  .btn.sm{padding:5px 10px; font-size:12.5px}
  .btn[disabled]{opacity:.5; cursor:default}

  main{padding:22px 28px 60px; max-width:1500px; margin:0 auto}
  .banner{margin:0 28px; padding:9px 14px; background:var(--no-bg); color:var(--no); border-radius:8px; font-size:13px}
  .banner[hidden]{display:none}
  .bar{display:flex; flex-wrap:wrap; gap:8px 18px; align-items:center; margin-bottom:18px}
  .grp{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  .grp .lbl{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin-right:2px}
  .chip{border:1px solid var(--line); background:transparent; border-radius:999px; padding:4px 11px; font-size:12.5px; color:var(--mut)}
  .chip[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--bg)}
  .count{font-family:var(--mono); font-size:12px; color:var(--mut); margin-left:auto}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:20px 18px}
  .card{display:flex; flex-direction:column; gap:9px; text-align:left; background:none; border:0; padding:0}
  .card .fig{position:relative; aspect-ratio:4/5; border-radius:10px; overflow:hidden; border:1px solid var(--line); background:var(--sunken)}
  .card:hover .fig{border-color:var(--mut)}
  .card img{width:100%; height:100%; object-fit:cover; object-position:top; display:block}
  .ph{width:100%; height:100%; display:flex; align-items:center; justify-content:center; text-align:center; padding:14px; font-size:12px; color:var(--mut);
      background:repeating-linear-gradient(135deg,var(--hatch-a) 0 14px,var(--hatch-b) 14px 28px)}
  .ph span{background:var(--surface); border-radius:6px; padding:5px 9px}
  .mark{position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; background:var(--surface); border:1px solid var(--line)}
  .mark.ok{background:var(--ok); color:var(--bg); border-color:var(--ok)}
  .mark.no{background:var(--no); color:#fff; border-color:var(--no)}
  .mark.q{background:var(--q); color:#fff; border-color:var(--q)}
  .ex{position:absolute; left:8px; top:8px; font-family:var(--mono); font-size:10.5px; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:2px 7px; color:var(--mut)}
  .card .t{font-weight:600; line-height:1.3}
  .card .m{font-size:12px; color:var(--mut)}
  .tags{display:flex; flex-wrap:wrap; gap:4px}
  .tag{font-family:var(--mono); font-size:11px; color:var(--mut); border:1px solid var(--line); border-radius:5px; padding:1px 6px}

  .empty{border:1px dashed var(--line); border-radius:12px; padding:40px 24px; text-align:center; color:var(--mut)}
  .empty b{display:block; color:var(--ink); font-size:16px; margin-bottom:6px}

  h2{font-size:20px; letter-spacing:-.01em; margin:0 0 4px}
  .sub{color:var(--mut); margin:0 0 18px; max-width:70ch}

  .cols{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px}
  .col{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:8px; text-align:left}
  .col:hover{border-color:var(--mut)}
  .col .thumbs{display:flex; gap:4px}
  .col .thumbs span{width:44px; height:56px; border-radius:6px; overflow:hidden; border:1px solid var(--line); background:var(--sunken)}
  .col .thumbs img{width:100%; height:100%; object-fit:cover; object-position:top}

  .mech{display:grid; gap:24px}
  .mech section{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px}
  .mech h3{margin:0 0 10px; font-size:14px; display:flex; align-items:center; gap:10px}
  .mech li{margin:0 0 8px; list-style:none; display:flex; gap:10px; align-items:baseline; flex-wrap:wrap}
  .mech ul{margin:0; padding:0}

  dialog{border:1px solid var(--line); border-radius:14px; padding:0; background:var(--surface); color:var(--ink); max-width:1080px; width:calc(100% - 32px); max-height:calc(100vh - 32px)}
  dialog::backdrop{background:rgba(10,12,13,.55)}
  .dhead{display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface); z-index:2}
  .dhead .st{margin-left:auto; font-family:var(--mono); font-size:12px; color:var(--mut)}
  .dbody{display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr); gap:22px; padding:18px}
  @media (max-width:820px){ .dbody{grid-template-columns:1fr} }
  .big{border-radius:10px; overflow:hidden; border:1px solid var(--line); background:var(--sunken); position:sticky; top:64px; align-self:start}
  .big img{width:100%; display:block; max-height:74vh; object-fit:contain; background:var(--sunken)}
  .big .ph{min-height:300px}
  .f{display:flex; flex-direction:column; gap:5px; margin-bottom:12px}
  .f label,.f .l{font-size:12px; color:var(--mut); font-weight:500}
  .f input,.f select,.f textarea{padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); width:100%}
  .f textarea{min-height:64px; resize:vertical}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .verd{display:flex; gap:6px}
  .verd button{flex:1; padding:8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); font-weight:600}
  .verd button.on[data-m="ok"]{background:var(--ok); color:var(--bg); border-color:var(--ok)}
  .verd button.on[data-m="no"]{background:var(--no); color:#fff; border-color:var(--no)}
  .verd button.on[data-m="q"]{background:var(--q); color:#fff; border-color:var(--q)}
  input.need{border-color:var(--no)!important; background:var(--no-bg)!important}
  details.sec{border:1px solid var(--line); border-radius:10px; margin-bottom:8px; background:var(--bg)}
  details.sec summary{padding:9px 12px; cursor:pointer; font-weight:600; font-size:13px; display:flex; justify-content:space-between}
  details.sec .in{padding:4px 12px 4px}
  .h3{font-size:13px; font-weight:700; margin:16px 0 8px; display:flex; align-items:center; gap:10px}
  .note{font-size:12px; color:var(--mut); background:var(--sunken); border-radius:8px; padding:8px 10px; margin-bottom:10px}
  .actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
  .toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:9px; font-size:13px; z-index:50; max-width:90vw}
  .toast[hidden]{display:none}
  .drop{border:1.5px dashed var(--line); border-radius:12px; padding:22px; text-align:center; color:var(--mut); background:var(--bg)}
  .drop.over{border-color:var(--accent); color:var(--ink)}
  .drop img{max-width:100%; max-height:240px; border-radius:8px; display:block; margin:0 auto 8px}
  @media (max-width:720px){
    .top{position:static; padding:12px 16px; gap:10px}
    .brand{margin-right:auto}
    .search{order:5; flex:1 1 100%; max-width:none; margin-left:0}
    main{padding:16px 16px 48px}
    .banner{margin:0 16px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px 12px}
    dialog{width:calc(100% - 16px); max-height:calc(100vh - 16px)}
    .dbody{padding:14px}
    .big{position:static}
  }
  @media (prefers-reduced-motion: no-preference){ .card .fig{transition:border-color .15s} }
</style>

<header class="top">
  <div class="brand">Референсы</div>
  <nav class="tabs" role="tablist" aria-label="Разделы">
    <button class="tab" role="tab" data-v="lib" aria-selected="true">Библиотека</button>
    <button class="tab" role="tab" data-v="cols" aria-selected="false">Подборки</button>
    <button class="tab" role="tab" data-v="mech" aria-selected="false">Механики</button>
  </nav>
  <input class="search" id="q" type="search" placeholder="Найти: название, тег, узел, приём" aria-label="Поиск">
  <button class="btn primary" id="add">Добавить</button>
</header>
<div class="banner" id="banner" hidden></div>
<main id="view" aria-live="polite"></main>

<dialog id="dlg-card" aria-label="Карточка референса"></dialog>
<dialog id="dlg-add" aria-label="Новый референс"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script>

  var caps = {db:null, assets:null, sample:null, user:null};
  var state = {refs:new Map(), cols:new Map(), v:'lib', q:'', type:'', verdict:'', tag:'', col:'', openCol:'', loaded:false, mem:false};

  var $ = function (s, r) { return (r || document).querySelector(s); };

  function h(tag, attrs) {

    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];

      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);

  function uid() { return (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)).replace(/-/g, '').slice(0, 10); }

    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, 3200);
  }
  function safeUrl(u) { try { var x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; } }

  async function initCaps() {

  }
  function fromSnap(snap) { var m = new Map(); snap.docs.forEach(function (d) { var x = d.data() || {}; x.id = d.id; m.set(d.id, x); }); return m; }

  });

  /* ---------- разбор картинки Claude ---------- */
  function imageBlob(assetId) {
    return new Promise(function (res, rej) {
      var img = new Image();
      img.onload = function () {
        var s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { b ? res(b) : rej(new Error('no blob')); }, 'image/jpeg', 0.9);
      };
      img.onerror = function () { rej(new Error('load')); };
      img.src = blobUrl(assetId);
    });
  }
  var aiCtl = null;
  async function runAI(r, btn, out, els) {
    if (aiCtl) { aiCtl.abort(); return; }
    out.replaceChildren(h('div', {class:'note', text:'Разбираю картинку. Обычно это занимает до минуты.'}));
    btn.textContent = 'Остановить';
    aiCtl = new AbortController();
    try {
      var lim = await caps.sample.limits().catch(function () { return null; });
      if (!lim || !lim.images) throw {code:'images_unavailable'};
      var blob = await imageBlob(r.asset);
      var schema = {}; DECOMP.forEach(function (s) { s.f.forEach(function (f) { schema[f[0]] = f[3].length ? 'одно из: ' + f[3].join(' | ') + ' — или своими словами' : (f[2] || 'коротко'); }); });
      var prompt = 'Ты помогаешь продуктовому дизайнеру разобрать визуальный референс на механику. На картинке референс из раздела «' + (TLABEL[r.type] || '') + '»' + (r.node ? ', нужен для узла «' + r.node + '»' : '') + '.\n' +
        'Заполни разбор строго по перечню ключей и верни ТОЛЬКО один JSON-объект вида {"dec": {ключ: значение}, "mech": [строки]}.\n' +
        'Правила: 1) значения выбирай из подсказок, если подходят, иначе пиши 2–8 слов своими словами; 2) если по картинке параметр определить нельзя, ставь пустую строку, ничего не выдумывай; ' +
        '3) цвета и пропорции называй как оценку по картинке и не выдавай за точные значения; 4) шрифт называй только категорией (гротеск, антиква, моно), никогда названием; ' +
        '5) для градиентов опиши слои: свет и материал отдельно от структуры, число форм, направление, блюр, шум; 6) «main», «strange», «meta» — по одному короткому предложению; ' +
        '7) «mech» — от 3 до 5 приёмов, которые можно воспроизвести без картинки, каждый начинается с глагола в повелительном наклонении.\n' +
        'Ключи и подсказки:\n' + JSON.stringify(schema, null, 1);
      var res = await caps.sample.json(prompt, {images: blob, signal: aiCtl.signal, modelTier: 'default'});
      var dec = (res && res.dec) || {}, n = 0;
      Object.keys(dec).forEach(function (k) { var v = dec[k]; if (typeof v === 'string' && v.trim() && !(r.dec[k] || '').trim() && els[k]) { r.dec[k] = v.trim(); els[k].value = v.trim(); n++; } });
      if (Array.isArray(res && res.mech) && !r.mech.length) { r.mech = res.mech.map(String).filter(Boolean).slice(0, 6); var mt = document.querySelector('#dlg-card textarea[placeholder^="Например"]'); if (mt) mt.value = r.mech.join('\n'); }
      out.replaceChildren(h('div', {class:'note', text:'Черновик Claude: заполнено ' + n + ' пустых полей, ваши записи не тронуты. Проверьте по картинке: цвета и пропорции здесь оценка.'}));
      document.querySelectorAll('#dlg-card details.sec').forEach(function (dt) { dt.open = true; });
      saveSoon();
    } catch (e) {
      var code = e && e.code, msg = {cancelled:'Остановлено.', images_unavailable:'В этом окне Claude не принимает картинки.', not_granted:'Доступ к Claude не разрешён для этой страницы.', rate_limited:'Слишком много запросов или исчерпан лимит, попробуйте позже.', image_rejected:'Картинка не подошла: слишком большая или неподдерживаемый формат.', invalid_json:'Ответ пришёл не в том формате, попробуйте ещё раз.'}[code] || 'Не получилось разобрать картинку. Попробуйте ещё раз.';
      out.replaceChildren(h('div', {class:'note', text:msg}));
    } finally { aiCtl = null; btn.textContent = 'Разобрать с Claude'; }
  }

  /* ---------- добавление ---------- */
  var addFile = null;
  function openAdd(file) {
    addFile = file || null;
    var d = $('#dlg-add'); d.replaceChildren();
    d.style.maxWidth = '560px';
    d.append(h('div', {class:'dhead'}, h('b', {text:'Новый референс'}), h('button', {class:'btn sm', style:'margin-left:auto', type:'button', text:'Отмена', onclick:function () { d.close(); }})));
    var box = h('div', {style:'padding:18px'}); d.append(box);
    var drop = h('label', {class:'drop', for:'file-in'}); var fin = h('input', {type:'file', id:'file-in', accept:'image/png,image/jpeg,image/webp,image/gif', hidden:true});
    function paintDrop() { drop.replaceChildren(); if (addFile) { drop.append(h('img', {src:URL.createObjectURL(addFile), alt:'Предпросмотр'}), h('span', {class:'mono', text:addFile.name || 'изображение из буфера'})); } else drop.append(caps.assets ? 'Перетащите картинку сюда, выберите файл или вставьте из буфера (Cmd/Ctrl+V)' : 'Загрузка картинок доступна тому, кто редактирует страницу. Референс можно добавить без картинки.'); }
    paintDrop();
    if (caps.assets || state.mem) {
      fin.addEventListener('change', function () { if (fin.files[0]) { addFile = fin.files[0]; paintDrop(); } });
      ['dragover', 'dragenter'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
      ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
      drop.addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files[0]; if (f && /^image\//.test(f.type)) { addFile = f; paintDrop(); } });
    }
    box.append(drop, fin);
    var title = h('input', {placeholder:'Что это: коротко, по сути приёма', 'aria-label':'Название'}), src = h('input', {placeholder:'Продукт или автор'}), url = h('input', {type:'url', placeholder:'https://'}), node = h('input', {placeholder:'Для какого узла или действия'});
    var sel = h('select'); TYPES.forEach(function (t) { sel.append(h('option', {value:t[0], text:t[1]})); });
    var form = h('div', {style:'margin-top:14px'}, field('Название', title), h('div', {class:'row2'}, field('Источник', src), field('Раздел', sel)), field('Ссылка', url), field('Для какого узла или действия', node));
    box.append(form);
    var go = h('button', {class:'btn primary', type:'button', text:'Добавить и разобрать', onclick:async function () {
      if (!title.value.trim()) { title.classList.add('need'); title.focus(); return; }
      go.disabled = true; go.textContent = 'Добавляю';
      var r = {id:uid(), title:title.value.trim(), source:src.value.trim(), url:url.value.trim(), type:sel.value, tags:[], node:node.value.trim(), take:'', avoid:'', verdict:{m:'', r:''}, dec:{}, mech:[], cols:[]};
      try {
        if (addFile && caps.assets) { var up = await caps.assets.upload(addFile); r.asset = up.id; }
        else if (addFile && state.mem) { r.asset = ''; toast('Без хранилища картинка не сохраняется'); }
      } catch (e) { toast('Картинка не загрузилась: ' + (e && e.code || 'ошибка') + '. Референс добавлен без неё.'); }
      await putDoc('refs', r); d.close(); state.v = 'lib'; render(); openCard(r.id);
    }});
    box.append(h('div', {class:'actions'}, go));
    d.showModal(); setTimeout(function () { title.focus(); }, 30);
  }

  /* ---------- события ---------- */
  document.querySelectorAll('.tab').forEach(function (b) { b.addEventListener('click', function () { state.v = b.dataset.v; state.openCol = ''; render(); }); });
  $('#q').addEventListener('input', function (e) { state.q = e.target.value; render(); });
  $('#add').addEventListener('click', function () { openAdd(); });
  document.addEventListener('paste', function (e) {
    var items = (e.clipboardData && e.clipboardData.items) || []; if (document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    for (var i = 0; i < items.length; i++) if (items[i].type.indexOf('image/') === 0) { var f = items[i].getAsFile(); if (f) { e.preventDefault(); openAdd(f); return; } }
  });
  window.addEventListener('dragover', function (e) { if (e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types, 'Files') >= 0 && !$('#dlg-add').open) e.preventDefault(); });
  window.addEventListener('drop', function (e) { if ($('#dlg-add').open || $('#dlg-card').open) return; var f = e.dataTransfer && e.dataTransfer.files[0]; if (f && /^image\//.test(f.type)) { e.preventDefault(); openAdd(f); } });

  render();
  initCaps().then(function () { subscribe(); render(); });
})();
</script>
